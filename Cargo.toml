[package]
name = "rsmpeg"
version = "0.18.0+ffmpeg.9.0"
authors = ["liudingming <liudingming@bytedance.com>"]
edition = "2024"
license = "MIT"
description = "A Rust crate that exposes FFmpeg's power as much as possible."
keywords = ["ffmpeg", "ffi", "binding", "audio", "video"]
homepage = "https://github.com/larksuite/rsmpeg"
documentation = "https://docs.rs/rsmpeg"
repository = "https://github.com/larksuite/rsmpeg"
readme = "README.md"
exclude = ["/.github", "/tests", "/utils"]
rust-version = "1.85.0"

[dependencies]
rusty_ffmpeg = { git = "https://gitee.com/phial3/rusty_ffmpeg.git", branch = "ffmpeg9" }

paste = "1.0"
thiserror = "2.0"
bon = "3"

[dev-dependencies]
libc = "0.2"
anyhow = "1"
camino = "1.2"
once_cell = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# Use FFmpeg 9 by default
default = ["ffmpeg9"]

# Note that ffmpeg{x} feature is designed to be addable (If it's not, compilation with all-features won't pass)
ffmpeg6 = ["rusty_ffmpeg/ffmpeg6"]
ffmpeg6_1 = ["ffmpeg6", "rusty_ffmpeg/ffmpeg6_1"]
# ffmpeg 7+
ffmpeg7 = ["ffmpeg6_1", "rusty_ffmpeg/ffmpeg7"]
ffmpeg7_1 = ["ffmpeg7", "rusty_ffmpeg/ffmpeg7_1"]
# ffmpeg 8+
ffmpeg8 = ["ffmpeg7_1", "rusty_ffmpeg/ffmpeg8"]
ffmpeg8_1 = ["ffmpeg8", "rusty_ffmpeg/ffmpeg8_1"]
# ffmpeg 9+ removed the deprecated AVCodec static array fields
# (pix_fmts, sample_fmts, supported_framerates, supported_samplerates,
# ch_layouts), use avcodec_get_supported_config() instead.
ffmpeg9 = ["ffmpeg8_1", "rusty_ffmpeg/ffmpeg9"]

# Try linking ffmpeg with pkg-config.
link_system_ffmpeg = ["rusty_ffmpeg/link_system_ffmpeg"]
# Try linking ffmpeg with vcpkg.
link_vcpkg_ffmpeg = ["rusty_ffmpeg/link_vcpkg_ffmpeg"]
